name: Build AbxOverflow APKs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # ============================================================
    # 1. 还原固定的密钥库（把下面的 Base64 替换成你自己的）
    # ============================================================
    - name: Restore fixed keystore
      run: |
        echo "" | base64 -d > debug.keystore

    # ============================================================
    # 2. 编译 droppedapk（强制 v1 签名）
    # ============================================================
    - name: Build droppedapk APK (Debug)
      run: ./gradlew :droppedapk:assembleDebug

    # ============================================================
    # 3. 从 APK 中提取证书（v1 签名可以正常提取）
    # ============================================================
    - name: Extract certificate and public key
      id: extract_cert
      run: |
        APK_PATH="droppedapk/build/outputs/apk/debug/droppedapk-debug.apk"
        
        # 提取 SHA-256 指纹
        CERT_HEX=$(keytool -printcert -jarfile "$APK_PATH" | grep "SHA-256" | head -1 | awk -F': ' '{print $2}' | tr -d ':')
        
        # 提取公钥
        keytool -printcert -jarfile "$APK_PATH" -rfc > cert.pem
        KEY_BASE64=$(openssl x509 -pubkey -noout -in cert.pem | grep -v "PUBLIC KEY" | tr -d '\n')
        
        echo "cert_hex=$CERT_HEX" >> $GITHUB_OUTPUT
        echo "key_base64=$KEY_BASE64" >> $GITHUB_OUTPUT

    # ============================================================
    # 4. 更新 Main.java
    # ============================================================
    - name: Update Main.java
      run: |
        CERT_HEX="${{ steps.extract_cert.outputs.cert_hex }}"
        KEY_BASE64="${{ steps.extract_cert.outputs.key_base64 }}"
        
        sed -i "s|static final String TARGET_CERT_HEX = \".*\"|static final String TARGET_CERT_HEX = \"$CERT_HEX\"|" app/src/main/java/com/example/abxoverflow/Main.java
        sed -i "s|static final String TARGET_KEY_BASE64 = \".*\"|static final String TARGET_KEY_BASE64 = \"$KEY_BASE64\"|" app/src/main/java/com/example/abxoverflow/Main.java

    # ============================================================
    # 5. 复制到 assets 并编译 app
    # ============================================================
    - name: Copy droppedapk to app assets
      run: |
        rm -rf app/src/main/assets
        mkdir -p app/src/main/assets
        cp droppedapk/build/outputs/apk/debug/droppedapk-debug.apk app/src/main/assets/droppedapk-release.apk

    - name: Build app APK (Debug)
      run: ./gradlew :app:assembleDebug

    - name: Upload APKs as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AbxOverflow-APKs
        path: |
          app/build/outputs/apk/debug/*.apk
          droppedapk/build/outputs/apk/debug/*.apk
