name: Build AbxOverflow APKs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 编译 droppedapk（自动使用 sdkLibrarySigningConfig）
    - name: Build droppedapk APK
      run: ./gradlew :droppedapk:assembleDebug

    # 复制到 app 的 assets 目录
    - name: Copy droppedapk to app assets
      run: |
        rm -rf app/src/main/assets
        mkdir -p app/src/main/assets
        cp droppedapk/build/outputs/apk/debug/droppedapk-debug.apk app/src/main/assets/droppedapk-release.apk

    # 编译 app（也需要配置相同的签名）
    - name: Build app APK
      run: ./gradlew :app:assembleDebug

    - name: Upload APKs as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AbxOverflow-APKs
        path: |
          app/build/outputs/apk/debug/*.apk
          droppedapk/build/outputs/apk/debug/*.apk
