name: Build AbxOverflow APKs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # 允许手动触发工作流
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build both APKs with Gradle
      # 执行 :app 和 :droppedapk 模块的 assembleRelease 任务
      run: ./gradlew :app:assembleRelease :droppedapk:assembleRelease

    - name: Upload APKs as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AbxOverflow-APKs
        # 保存两个模块生成的 APK
        path: |
          app/build/outputs/apk/release/*.apk
          droppedapk/build/outputs/apk/release/*.apk
