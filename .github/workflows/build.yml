name: Build AbxOverflow APKs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # 允许手动触发工作流
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 1. 首先编译 droppedapk
    - name: Build droppedapk APK
      run: ./gradlew :droppedapk:assembleRelease

    # 2. 手动将编译好的 droppedapk APK 复制到 app 的 assets 目录
    - name: Copy droppedapk to app assets
      run: |
        mkdir -p app/src/main/assets
        cp droppedapk/build/outputs/apk/release/droppedapk-release.apk app/src/main/assets/droppedapk.apk

    # 3. 然后编译 app（此时其 assets 目录已包含最新的 droppedapk）
    - name: Build app APK
      run: ./gradlew :app:assembleRelease

    # 4. 上传两个 APK 作为构件
    - name: Upload APKs as artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AbxOverflow-APKs
        path: |
          app/build/outputs/apk/release/*.apk
          droppedapk/build/outputs/apk/release/*.apk
